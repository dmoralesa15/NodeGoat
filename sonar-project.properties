# ==========================================================
# Configuracion de SonarQube Cloud - OWASP NodeGoat
# Examen Corto - Aseguramiento de la Calidad de Software
# Tecnologia: Node.js
# Repositorio: https://github.com/dmoralesa15/NodeGoat (fork de OWASP/NodeGoat)
#
# NOTA IMPORTANTE:
# NodeGoat es una aplicacion DELIBERADAMENTE INSEGURA (OWASP Top 10).
# El proposito de esta configuracion es QUE EL ANALISIS DETECTE los
# problemas. NO se agregan exclusiones para "limpiar" los resultados.
# ==========================================================

# Identificacion del proyecto (obligatorio en SonarQube Cloud)
sonar.projectKey=dmoralesa15_NodeGoat
sonar.organization=dmoralesa15
sonar.projectName=OWASP NodeGoat (Analisis Estatico)

# Codificacion de fuentes
sonar.sourceEncoding=UTF-8

# Ambito de analisis: TODO el codigo real de la aplicacion.
# No se excluye app/, config/ ni test/ para no falsear los resultados.
sonar.sources=app,config,server.js,Gruntfile.js
sonar.tests=test

# Solo se excluyen artefactos generados y librerias de terceros,
# que no son codigo fuente propio del proyecto.
sonar.exclusions=app/assets/vendor/**,**/*.min.js,artifacts/**,node_modules/**,coverage/**
sonar.coverage.exclusions=app/assets/vendor/**,**/*.min.js,test/**,**/cypress/**

# Cobertura: NodeGoat no genera reporte LCOV por defecto.
sonar.javascript.lcov.reportPaths=coverage/lcov.info